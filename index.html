<header><div class="top wm"><h1>POLAKA — Python Conditional Statements Lab</h1><div class="tag">Learn Logic. Write Code. Prove Your Skills.</div><div class="tr1">Polaka Pavan Kumar | Technical Trainer</div><nav id="nav"></nav></div></header>

<script>
const Qs=[],M=Math,L=["","Level 1 — Basic If","Level 2 — If-Else","Level 3 — If-Elif-Else","Level 4 — Nested Conditions","Level 5 — Challenge Zone","TCS NQT Questions — 2026"];
const q=(l,t,s,T,f,p=2)=>{const [pr,inf,out]=s.split("~");Qs.push({id:Qs.length+1,l,t,pr,inf,out,f,p,T:T.split("|").map(x=>x.split(";"))})};
const nm=a=>a.map(Number),DY=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],MO=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DS=(x,p)=>{if(x<0)return"Invalid Amount";const r=x>=5000?20:x>=3000?15:x>=1000?10:0,d=x*r/100;return`${p[0]}: ${x.toFixed(2)}\n${p[1]}: ${d.toFixed(2)}\n${p[2]}: ${(x-d).toFixed(2)}`};
const IN="One integer.",E="Print only what is stated; no extra text. Do not pass a prompt to input().";
// Level 1
q(1,"Positive Number","Read a number and check whether it is positive.~"+IN+"~Print Positive if the number is greater than 0. Otherwise print nothing.","5|12|-3|0|-100|1",a=>+a[0]>0?"Positive":"");
q(1,"Negative Number","Read a number and check whether it is negative.~"+IN+"~Print Negative if the number is less than 0. Otherwise print nothing.","-4|-9|7|0|-1|3",a=>+a[0]<0?"Negative":"");
q(1,"Even Number","Read a number and check whether it is even.~"+IN+"~Print Even if the number is even (zero is even). Otherwise print nothing.","4|10|7|0|-2|9",a=>+a[0]%2==0?"Even":"");
q(1,"Divisible by 5","Read a number and check whether it is divisible by 5.~"+IN+"~Print Divisible by 5 if it is. Otherwise print nothing.","10|25|7|0|-15|11",a=>+a[0]%5==0?"Divisible by 5":"");
q(1,"Voting Eligibility","Read a person’s age and check whether the person can vote. Use 18 as the minimum age.~One integer (age).~Print Eligible to vote if age is 18 or above. Otherwise print nothing.","20|18|17|0|65|5",a=>+a[0]>=18?"Eligible to vote":"");
q(1,"Pass or Fail","Read marks and print Pass if marks are 40 or above.~One integer (marks).~Marks below 0 or above 100: print Invalid Marks. Marks 40 to 100: print Pass. Otherwise print nothing.","75|40|39|0|100|101|-5",a=>{const m=+a[0];return m<0||m>100?"Invalid Marks":m>=40?"Pass":""});
// Level 2
q(2,"Even or Odd","Read a number and print whether it is even or odd.~"+IN+"~Print Even or Odd.","4|7|0|-3|-8",a=>+a[0]%2==0?"Even":"Odd");
q(2,"Positive or Negative","Read a number and print whether it is positive or negative.~"+IN+"~Print Positive, Negative, or Zero (for 0).","5|-5|0|1|-100",a=>+a[0]>0?"Positive":+a[0]<0?"Negative":"Zero");
q(2,"Largest of Two Numbers","Read two numbers and print the largest.~Two integers, one per line.~Print the larger number. If both are equal, print Equal.","3;5|9;2|4;4|-1;-5|0;0|7;-7",a=>a[0]==a[1]?"Equal":""+M.max(...nm(a)));
q(2,"Smallest of Two Numbers","Read two numbers and print the smallest.~Two integers, one per line.~Print the smaller number. If both are equal, print Equal.","3;5|9;2|4;4|-1;-5|0;0|7;-7",a=>a[0]==a[1]?"Equal":""+M.min(...nm(a)));
q(2,"Eligible for Driving License","Read age and decide driving license eligibility.~One integer (age).~Age 18 or above: Eligible. Otherwise: Not Eligible.","20|18|17|0|60",a=>+a[0]>=18?"Eligible":"Not Eligible");
q(2,"Divisible by 3 or Not","Read a number and check whether it is divisible by 3.~"+IN+"~Print Divisible by 3 or Not divisible by 3.","9|10|0|-3|7|12",a=>+a[0]%3==0?"Divisible by 3":"Not divisible by 3");
q(2,"Profit or Loss","Read the Cost Price and the Selling Price and decide the outcome.~Two integers: cost price, then selling price.~Selling above cost: Profit. Selling below cost: Loss. Equal: No Profit No Loss.","100;150|150;100|100;100|0;5|5;0|999;1000",a=>+a[1]>+a[0]?"Profit":+a[1]<+a[0]?"Loss":"No Profit No Loss");
q(2,"Password Check","Read a password and check it against the stored password python123. This is a classroom exercise, not secure authentication.~One line of text.~Match: Login Successful. Otherwise: Invalid Password.","python123|abc|python1234|PYTHON123|py",a=>a[0]=="python123"?"Login Successful":"Invalid Password");
// Level 3
q(3,"Largest of Three Numbers","Read a, b and c and find the largest.~Three integers, one per line.~Print the largest number. Equal values must work.","1;2;3|9;4;7|5;5;2|3;3;3|-1;-5;-3|0;8;8",a=>""+M.max(...nm(a)));
q(3,"Smallest of Three Numbers","Read three numbers and find the smallest.~Three integers, one per line.~Print the smallest number. Equal values must work.","4;2;9|9;4;7|5;5;2|3;3;3|-1;-5;-3|8;8;0",a=>""+M.min(...nm(a)));
q(3,"Student Grade","Read marks and print the grade. 90–100 A, 75–89 B, 60–74 C, 40–59 D, below 40 Fail.~One integer (marks).~Print A, B, C, D or Fail. Marks outside 0–100: print Invalid Marks.","95|80|65|45|20|90|89|75|74|60|59|40|39|101|-1",a=>{const m=+a[0];return m<0||m>100?"Invalid Marks":m>=90?"A":m>=75?"B":m>=60?"C":m>=40?"D":"Fail"});
q(3,"Temperature Classification","Classify a Celsius temperature. Above 40 Very Hot, 30–40 Hot, 20–29 Normal, below 20 Cold.~One integer (Celsius).~Print Very Hot, Hot, Normal or Cold.","45|35|25|10|41|40|30|29|20|19",a=>{const t=+a[0];return t>40?"Very Hot":t>=30?"Hot":t>=20?"Normal":"Cold"});
q(3,"Number Classification","Identify whether a number is positive, negative or zero.~"+IN+"~Print Positive, Negative or Zero.","5|-2|0|100|-100",a=>+a[0]>0?"Positive":+a[0]<0?"Negative":"Zero");
q(3,"Day Number","Read a number from 1 to 7 and print the day (1 Monday … 7 Sunday).~One integer.~Print the day name. Any other value: Invalid Day.","1|7|4|0|8|-3|6",a=>DY[+a[0]-1]||"Invalid Day");
q(3,"Month Number","Read a number from 1 to 12 and print the month name (1 January … 12 December).~One integer.~Print the month name. Any other value: Invalid Month.","1|12|6|0|13|-2|9",a=>MO[+a[0]-1]||"Invalid Month");
q(3,"Simple Calculator","Read two numbers and an operator (+, -, *, /) and perform the operation using conditional statements.~Three lines: first integer, second integer, operator.~For + - * print the integer result. For / print the result with 2 decimal places. Division by zero: Division by zero. Any other operator: Invalid Operator.","6;3;+|8;2;-|4;5;*|7;2;/|5;0;/|3;4;%|10;3;/",a=>{const x=+a[0],y=+a[1],o=a[2];return o=="+"?x+y+"":o=="-"?x-y+"":o=="*"?x*y+"":o=="/"?(y==0?"Division by zero":(x/y).toFixed(2)):"Invalid Operator"});
// Level 4
q(4,"ATM Withdrawal","Read the account balance and a withdrawal amount. Allow the withdrawal only if the balance is sufficient.~Two integers: balance, then withdrawal amount.~Enough balance: Remaining Balance: X. Otherwise: Insufficient Balance. Negative balance, or withdrawal of 0 or less: Invalid Input.","5000;2000|1000;1500|1000;1000|0;0|-500;100|500;-50|500;0|2000;1",a=>{const b=+a[0],w=+a[1];return b<0||w<=0?"Invalid Input":w<=b?"Remaining Balance: "+(b-w):"Insufficient Balance"});
q(4,"Electricity Bill","Calculate a progressive bill: first 100 units at 2 per unit, next 100 units at 3 per unit, units above 200 at 5 per unit.~One integer (units).~Print Bill: X. Negative units: Invalid Units.","50|150|100|200|250|0|-5|201|101",a=>{const u=+a[0];return u<0?"Invalid Units":"Bill: "+(u<=100?2*u:u<=200?200+3*(u-100):500+5*(u-200))});
q(4,"Movie Ticket","Read age and print the ticket price. Below 5 Free, 5–12 is 100, 13–59 is 200, 60 and above is 120.~One integer (age).~Print Ticket: Free or Ticket: PRICE. Negative age: Invalid Age.","3|10|30|65|-1|5|12|13|59|60|0",a=>{const g=+a[0];return g<0?"Invalid Age":"Ticket: "+(g<5?"Free":g<=12?100:g<=59?200:120)});
q(4,"Shopping Discount","Discount by amount: 5000 and above 20%, 3000 to below 5000 15%, 1000 to below 3000 10%, below 1000 none.~One integer (amount).~Three lines, each with 2 decimals: Original: X, Discount: X, Payable: X. Negative amount: Invalid Amount.","6000|3500|1500|500|-10|5000|3000|1000|999",a=>DS(+a[0],["Original","Discount","Payable"]));
q(4,"Login System","Read a username and password. Demonstration credentials: username admin, password python123.~Two lines: username, then password.~Both correct: Login Successful. Username correct, password wrong: Wrong Password. Wrong username: User Not Found.","admin;python123|admin;wrong|guest;python123|guest;x|Admin;python123|admin;",a=>a[0]!="admin"?"User Not Found":a[1]=="python123"?"Login Successful":"Wrong Password");
q(4,"Leap Year","Check whether a year is a leap year: divisible by 400, or divisible by 4 but not by 100.~One integer (year).~Print Leap Year or Not a Leap Year.","2024|2023|1900|2000|2100|2020|1|4",a=>+a[0]%400==0||+a[0]%4==0&&+a[0]%100!=0?"Leap Year":"Not a Leap Year");
q(4,"Triangle Validity","Check whether three angles form a valid triangle: every angle greater than 0 and the sum exactly 180.~Three integers, one per line.~Print Valid Triangle or Invalid Triangle.","60;60;60|90;45;45|100;50;40|0;90;90|-30;100;110|180;0;0|50;50;80|60;60;70",a=>{const [x,y,z]=nm(a);return x>0&&y>0&&z>0&&x+y+z==180?"Valid Triangle":"Invalid Triangle"});
q(4,"Triangle Type","Read three side lengths and identify the triangle. Every side must be positive and the sum of any two sides must be greater than the third.~Three integers, one per line.~Print Equilateral, Isosceles or Scalene. Invalid sides: Invalid Triangle.","3;3;3|5;5;8|3;4;5|1;2;3|0;4;4|-3;4;5|2;2;4|7;7;7|6;6;10|4;5;5",a=>{const [x,y,z]=nm(a);return x<=0||y<=0||z<=0||x+y<=z||x+z<=y||y+z<=x?"Invalid Triangle":x==y&&y==z?"Equilateral":x==y||y==z||x==z?"Isosceles":"Scalene"});
// Level 5
q(5,"Second Largest Among Three Numbers","Find the second-largest distinct number among three numbers.~Three integers, one per line.~Print the second-largest distinct value. If fewer than two distinct values exist, print No second largest.","3;7;5|9;9;4|4;4;4|6;6;9|1;2;3|10;10;10|-1;-5;-3|8;2;2",a=>{const d=[...new Set(nm(a))].sort((x,y)=>y-x);return d.length<2?"No second largest":""+d[1]});
q(5,"Divisible by Both 3 and 5","Check whether a number is divisible by both 3 and 5.~"+IN+"~Print Yes or No.","15|9|30|10|0|45|-15|5",a=>+a[0]%15==0?"Yes":"No");
q(5,"Student Exam Eligibility","A student is eligible with attendance of at least 75 percent and marks of at least 40. Both conditions are required.~Two integers: attendance, then marks.~Print Eligible or Not Eligible. Either value outside 0–100: Invalid Input.","80;60|70;60|80;30|75;40|74;40|75;39|101;50|50;-1|0;0",a=>{const [t,m]=nm(a);return t<0||t>100||m<0||m>100?"Invalid Input":t>=75&&m>=40?"Eligible":"Not Eligible"});

q(5,"Simple Banking Menu","Menu: 1 Check Balance, 2 Deposit, 3 Withdraw, 4 Exit. Start with a balance of 1000. Read choices repeatedly; after choice 2 or 3 read an amount.~Lines of integers: a choice, plus an amount after 2 or 3. The input always ends with 4.~1: Balance: X. 2: Deposited. Balance: X. 3: Withdrawn. Balance: X. Amount 0 or less: Invalid Amount. Withdrawal above balance: Insufficient Balance. 4: Goodbye and stop. Other choice: Invalid Choice.","1;4|2;500;1;4|3;300;1;4|3;5000;4|2;-5;3;0;4|5;4|3;1000;1;4|2;250;3;1250;1;4",a=>{let b=1000,i=0;const o=[];while(i<a.length){const c=a[i++];if(c=="1")o.push("Balance: "+b);else if(c=="2"){const m=+a[i++];if(m<=0)o.push("Invalid Amount");else{b+=m;o.push("Deposited. Balance: "+b)}}else if(c=="3"){const m=+a[i++];if(m<=0)o.push("Invalid Amount");else if(m>b)o.push("Insufficient Balance");else{b-=m;o.push("Withdrawn. Balance: "+b)}}else if(c=="4"){o.push("Goodbye");break}else o.push("Invalid Choice")}return o.join("\n")});

const rd=f=>{if(Sk.builtinFiles===undefined||Sk.builtinFiles.files[f]===undefined)throw"File not found: '"+f+"'";return Sk.builtinFiles.files[f]};
